<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>GamerZone - Contacto</title>
    </head>
    <body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #1a1a2e; color: #ffffff;">
        <nav style="background-color: #16213e; padding: 15px; text-align: center; border-radius: 5px;">
            <a href="index.html" style="color: #ffffff; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a>
            <a href="about.html" style="color: #ffffff; margin: 0 15px; text-decoration: none; font-weight: bold;">Acerca de</a>
            <a href="contact.html" style="color: #e94560; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
        </nav>
        <main style="max-width: 500px; margin: 40px auto;">
            <h1 style="color: #e94560; text-align: center;">Contáctanos</h1>
            <form style="background-color: #16213e; padding: 25px; border-radius: 8px;">
                <label style="display: block; margin-bottom: 8px;">Nombre:</label>
                <input type="text" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border-radius: 4px; border: none;">
                <label style="display: block; margin-bottom: 8px;">Correo Electrónico:</label>
                <input type="email" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border-radius: 4px; border: none;">
                <label style="display: block; margin-bottom: 8px;">Mensaje:</label>
                <textarea rows="4" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border-radius: 4px; border: none;"></textarea>
                <button type="submit" style="background-color: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">Enviar</button>
            </form>
        </main>
    </body>
</html>
